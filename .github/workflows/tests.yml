name: Automated Tests CI

on:
  push:
    branches:
      - feature/test-automation
      - master
  pull_request:
    branches:
      - master
      - feature/test-automation

jobs:
  test-api:
    name: Run API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest requests

      - name: Start FastAPI Backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "FastAPI background process launched"

      - name: Wait for API Readiness
        run: |
          timeout 30s bash -c 'until curl -s http://127.0.0.1:8000/health | grep -q "ok"; do sleep 1; done'
          echo "FastAPI server is ready!"

      - name: Run API Tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          pytest tests/api/ -v -m "smoke or edge"
